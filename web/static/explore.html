<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>조건으로 모델 찾기</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%232b4a8b%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27monospace%27 font-size=%2715%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23fff%27%3EFT%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <h1 id="title"></h1>
    <p class="caption" id="caption"></p>
    <div id="notices"></div>
    <form class="search-row" id="explore-form">
      <label class="label hidden" for="request" id="input-label"></label>
      <input type="text" id="request" maxlength="2000" autocomplete="off">
      <button type="submit" id="explore-btn"></button>
    </form>
    <div class="caption" id="explore-status"></div>
    <details id="applied" class="hidden" style="margin-top:8px">
      <summary id="applied-title"></summary>
      <ul class="facts" id="applied-list"></ul>
    </details>
    <div class="caption" id="summary-line"></div>
    <div class="results" id="results"></div>
    <p class="caption" id="popularity"></p>
    <p class="caption" id="disclaimer"></p>
  </main>
  <script src="js/common.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
